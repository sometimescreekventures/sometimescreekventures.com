# PR checks: both halves of the repo must build.
# The infra job needs no AWS credentials — the hosted-zone lookup for the
# placeholder account is pre-seeded in infra/cdk.context.json.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build

  infra:
    name: Test and synth infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install
        working-directory: infra
        run: npm ci
      - name: Typecheck
        working-directory: infra
        run: npm run build
      - name: Test
        working-directory: infra
        run: npm test
      - name: Synth
        working-directory: infra
        run: npx cdk synth -q
