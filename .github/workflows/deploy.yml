# Deploys the site to S3 + CloudFront on every push to main.
# Auth is GitHub OIDC only — no AWS keys exist anywhere in this repo.
# Required repo variables (from the ScvSiteStack outputs):
#   AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, CF_DISTRIBUTION_ID, AWS_REGION
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets (immutable, long cache)
        run: |
          aws s3 sync site/dist "s3://${{ vars.SITE_BUCKET }}" \
            --delete \
            --exclude '*' --include '_astro/*' \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Sync HTML and the rest (no-cache)
        run: |
          aws s3 sync site/dist "s3://${{ vars.SITE_BUCKET }}" \
            --delete \
            --exclude '_astro/*' \
            --cache-control 'no-cache'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths '/*'
